# Copy this file to secrets.yaml next to the ESPHome device config and fill
# it in. If you use ESPHome Device Builder, add these keys to its existing
# secrets.yaml instead.
#
# secrets.yaml is listed in .gitignore so real values never get committed.

wifi_ssid: "YOUR_WIFI_NAME"
wifi_password: "YOUR_WIFI_PASSWORD"

# Password for the fallback hotspot the clock opens when it cannot join WiFi.
# At least 8 characters.
ap_password: "change-me-please"

# 32 random bytes, base64 encoded. Encrypts the link to Home Assistant and
# OTA updates. Generate one with either of:
#   openssl rand -base64 32
#   python -c "import base64, os; print(base64.b64encode(os.urandom(32)).decode())"
api_key: "PASTE_GENERATED_KEY_HERE"
