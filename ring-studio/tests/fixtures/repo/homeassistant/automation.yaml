alias: Energiklockan adaptive brightness
description: Adjust ring brightness with daylight and keep it dark overnight.
triggers:
  - trigger: time_pattern
    minutes: "/1"
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id: number.energiklockan_ring_brightness
    from: "unavailable"
  - trigger: state
    entity_id: number.energiklockan_ring_brightness
    from: "unknown"

conditions:
  - condition: template
    value_template: >
      {{ is_number(states('number.energiklockan_ring_brightness')) }}

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ now().hour < 6 or now().hour >= 23 }}"
        sequence:
          - action: number.set_value
            target:
              entity_id: number.energiklockan_ring_brightness
            data:
              value: 0
    default:
      - condition: template
        value_template: "{{ is_number(state_attr('sun.sun', 'elevation')) }}"
      - action: number.set_value
        target:
          entity_id: number.energiklockan_ring_brightness
        data:
          value: >
            {% set elevation = state_attr('sun.sun', 'elevation') | float %}
            {% set fraction = [[(elevation + 6) / 36, 0] | max, 1] | min %}
            {{ (10 + 80 * fraction) | round(0) | int }}

mode: restart
