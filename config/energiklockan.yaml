substitutions:
  name: energiklockan
  friendly_name: Energiklockan

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: ring
          brightness: 100%
          effect: "Price Ring"

esp8266:
  board: esp12e

# Logs go over the Home Assistant API, not the serial line. baud_rate 0 frees the
# UART pins and keeps the device quiet.
logger:
  level: WARN
  baud_rate: 0

# Encrypted link to Home Assistant on the LAN. The API requires the encryption key.
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Local recovery hotspot if WiFi is unavailable.
  ap:
    ssid: "Energiklockan Setup"
    password: !secret ap_password

captive_portal:

# Time from Home Assistant, so the device never needs the internet.
time:
  - platform: homeassistant
    id: ha_time

# The 36 ring colours, computed in Home Assistant and pushed to the device.
text_sensor:
  - platform: homeassistant
    id: ring_colors
    entity_id: sensor.energiklockan_ring_colors

# Brightness cap, 0 to 90. This is colour scaling, not a measured power limit.
number:
  - platform: template
    name: "Ring Brightness"
    id: ring_brightness
    optimistic: true
    restore_value: true
    initial_value: 40
    min_value: 0
    max_value: 90
    step: 1
    mode: slider

light:
  - platform: neopixelbus
    id: ring
    name: "Energiklockan Ring"
    variant: WS2812
    type: GRB
    pin: GPIO12
    method:
      type: bit_bang
    gamma_correct: 1.0
    num_leds: 36
    default_transition_length: 300ms
    restore_mode: ALWAYS_ON
    effects:
      # Normal mode: paint the 36 colours Home Assistant sends.
      - addressable_lambda:
          name: "Price Ring"
          update_interval: 1s
          lambda: |-
            std::string s = id(ring_colors).state;
            if (s.length() < 216)
              return;
            float scale = id(ring_brightness).state / 255.0f;
            for (int i = 0; i < 36; i++) {
              int r = (int) strtol(s.substr(i * 6, 2).c_str(), nullptr, 16);
              int g = (int) strtol(s.substr(i * 6 + 2, 2).c_str(), nullptr, 16);
              int b = (int) strtol(s.substr(i * 6 + 4, 2).c_str(), nullptr, 16);
              it[i] = Color((uint8_t)(r * scale), (uint8_t)(g * scale), (uint8_t)(b * scale));
            }
      # Hardware test: confirms every LED and the data pin, no Home Assistant needed.
      - addressable_rainbow:
          name: "Rainbow Test"
