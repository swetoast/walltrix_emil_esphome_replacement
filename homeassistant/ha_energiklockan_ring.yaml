# Home Assistant template sensor for the EnergiKlockan ring.
# Add this under your existing "template:" key, or paste the whole block if you
# have none. It turns the 15-minute SE3 forecast into 36 colours for the ring.
#
# Output is a 216-character string: 36 colours, 6 hex digits each (RRGGBB).
# Prices use neon blue, purple and pink; negative prices use ice blue, and
# the current 15-minute slot is shown at full brightness while the rest are
# dimmed so "now" stands out. The window is the next 9 hours from now.

template:
  - sensor:
      - name: "Energiklockan Ring Colors"
        unique_id: energiklockan_ring_colors
        state: >
          {%- set ent = 'sensor.swedish_spot_price_elpris_se3_forecast' -%}
          {%- set cap = 100.0 -%}
          {%- set palette = [[0,191,255], [0,112,255], [0,64,255], [64,0,255], [128,0,255], [176,0,255], [255,0,255], [255,0,128], [255,0,64]] -%}
          {%- set slots = (state_attr(ent, 'today') or []) + (state_attr(ent, 'tomorrow') or []) -%}
          {%- set tsnow = now().timestamp() -%}
          {%- set ns = namespace(start=-1) -%}
          {%- for s in slots -%}
            {%- if ns.start < 0 and as_timestamp(s.time_start) <= tsnow < as_timestamp(s.time_end) -%}
              {%- set ns.start = loop.index0 -%}
            {%- endif -%}
          {%- endfor -%}
          {%- if ns.start < 0 -%}{%- set ns.start = 0 -%}{%- endif -%}
          {%- set o = namespace(s='') -%}
          {%- for k in range(36) -%}
            {%- set idx = ns.start + k -%}
            {%- if idx < slots | length -%}
              {%- set p = (slots[idx].SEK_per_kWh | float) * 100.0 -%}
              {%- set frac = [[p / cap, 0.0] | max, 1.0] | min -%}
              {%- set pos = frac * ((palette | length) - 1) -%}
              {%- set lo = pos | int -%}
              {%- set hi = [lo + 1, (palette | length) - 1] | min -%}
              {%- set blend = pos - lo -%}
              {%- set r = palette[lo][0] + (palette[hi][0] - palette[lo][0]) * blend -%}
              {%- set g = palette[lo][1] + (palette[hi][1] - palette[lo][1]) * blend -%}
              {%- set b = palette[lo][2] + (palette[hi][2] - palette[lo][2]) * blend -%}
              {%- set dim = 1.0 if k == 0 else 0.55 -%}
              {%- set r = (r * dim) | int -%}
              {%- set g = (g * dim) | int -%}
              {%- set b = (b * dim) | int -%}
            {%- else -%}
              {%- set r = 0 -%}{%- set g = 0 -%}{%- set b = 0 -%}
            {%- endif -%}
            {%- set o.s = o.s ~ '%02x%02x%02x' | format(r, g, b) -%}
          {%- endfor -%}
          {{ o.s }}
