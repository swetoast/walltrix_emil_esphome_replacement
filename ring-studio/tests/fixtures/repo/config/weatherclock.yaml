substitutions:
  name: weatherclock
  friendly_name: WeatherClock

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: ring
          brightness: 100%
          effect: "Weather Ring"

esp8266:
  board: esp12e

logger:
  level: WARN
  baud_rate: 0

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "WeatherClock Setup"
    password: !secret ap_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

text_sensor:
  - platform: homeassistant
    id: ring_colors
    entity_id: sensor.weatherclock_ring_colors

number:
  - platform: template
    name: "Ring Brightness"
    id: ring_brightness
    optimistic: true
    restore_value: true
    initial_value: 40
    min_value: 0
    max_value: 90
    step: 1
    mode: slider

light:
  - platform: neopixelbus
    id: ring
    name: "WeatherClock Ring"
    variant: WS2812
    type: GRB
    pin: GPIO12
    method:
      type: bit_bang
    gamma_correct: 1.0
    num_leds: 36
    default_transition_length: 300ms
    restore_mode: ALWAYS_ON
    effects:
      - addressable_lambda:
          name: "Weather Ring"
          update_interval: 1s
          lambda: |-
            std::string s = id(ring_colors).state;
            if (s.length() < 216)
              return;
            float scale = id(ring_brightness).state / 255.0f;
            for (int i = 0; i < 36; i++) {
              int r = (int) strtol(s.substr(i * 6, 2).c_str(), nullptr, 16);
              int g = (int) strtol(s.substr(i * 6 + 2, 2).c_str(), nullptr, 16);
              int b = (int) strtol(s.substr(i * 6 + 4, 2).c_str(), nullptr, 16);
              it[i] = Color((uint8_t)(r * scale), (uint8_t)(g * scale), (uint8_t)(b * scale));
            }
      - addressable_rainbow:
          name: "Rainbow Test"
